[project]
name = "unstop-autopilot"
version = "0.1.0"
description = "Local-first autonomous AI competition management system for Unstop"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "playwright>=1.40",
    "rich>=13.0",
    "textual>=0.50",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "python-pptx>=0.6.23",
    "reportlab>=4.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
daedalus = "main:main"
unstop-autopilot = "main:main"

[tool.setuptools.packages.find]
include = [
    "agents*",
    "browser*",
    "config*",
    "database*",
    "documents*",
    "intelligence*",
    "quiz*",
    "scheduler*",
    "submissions*",
    "achievements*",
    "terminal*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
